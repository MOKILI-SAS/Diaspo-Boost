services:
  mysql:
    image: mysql:8.0
    container_name: diaspoboost-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: diaspoboost
      MYSQL_USER: diaspoboost
      MYSQL_PASSWORD: diaspoboost
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=caching_sha2_password
    volumes:
      - diaspoboost_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-udiaspoboost", "-pdiaspoboost"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    container_name: diaspoboost-pma
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: diaspoboost
      PMA_PASSWORD: diaspoboost
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  diaspoboost_mysql:
